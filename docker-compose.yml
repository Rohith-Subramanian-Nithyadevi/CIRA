services:
  postgres:
    image: postgres:15
    container_name: cira_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cira_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cira_password}
      POSTGRES_DB: ${POSTGRES_DB:-cira_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongo1:
    image: mongo:6.0
    container_name: cira_mongo1
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo1_data:/data/db
    restart: unless-stopped

  mongo2:
    image: mongo:6.0
    container_name: cira_mongo2
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27018" ]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo2_data:/data/db
    restart: unless-stopped

  mongo3:
    image: mongo:6.0
    container_name: cira_mongo3
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27019" ]
    ports:
      - "127.0.0.1:27019:27019"
    volumes:
      - mongo3_data:/data/db
    restart: unless-stopped

  mongo-init:
    image: mongo:6.0
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    restart: "on-failure"
    entrypoint: >
      bash -c "
        until mongosh --host mongo1:27017 --eval 'db.adminCommand(\"ping\")' > /dev/null 2>&1; do
          echo 'Waiting for mongo1 connection...';
          sleep 1;
        done;
        mongosh --host mongo1:27017 --eval '
          try {
            rs.status();
            console.log(\"Replica set already initialized\");
          } catch (e) {
            rs.initiate({
              _id: \"rs0\",
              members: [
                { _id: 0, host: \"mongo1:27017\" },
                { _id: 1, host: \"mongo2:27018\" },
                { _id: 2, host: \"mongo3:27019\" }
              ]
            });
          }
        '
      "

  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: cira_backend_core
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://cira_user:cira_password@postgres:5432/cira_db}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo1:27017/cira-exams}
      - JWT_SECRET=${JWT_SECRET:-cira-super-secret-jwt-key}
    depends_on:
      - postgres
      - mongo-init
    restart: unless-stopped

  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: cira_backend_ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo1:27017/cira-exams}
    depends_on:
      - mongo-init
    restart: unless-stopped

  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: cira_frontend_web
    ports:
      - "80:80"
    depends_on:
      - backend-core
    restart: unless-stopped

volumes:
  postgres_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
